name: Build JambuL AI Tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q JambuL_AI_Tools_APK_CloudBuild*.zip -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts/settings.gradle tidak ditemukan."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Found project: $SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle 8.10.2
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Align Java and Kotlin JVM targets
        run: |
          cd "$PROJECT_DIR"
          cat >> build.gradle.kts <<'EOF'

// CI compatibility: compile Java and Kotlin to the same JVM target.
tasks.withType<JavaCompile>().configureEach {
    sourceCompatibility = "17"
    targetCompatibility = "17"
}

tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
    kotlinOptions.jvmTarget = "17"
}
EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JambuL-AI-Tools-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
