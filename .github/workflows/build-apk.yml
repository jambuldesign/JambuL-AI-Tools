name: Build JambuL AI Tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          SETTINGS="$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Android project: $SETTINGS"

      - name: Inspect project source
        shell: bash
        run: |
          set -e
          {
            echo '=== PROJECT FILES ==='
            find project -type f \
              ! -path '*/.gradle/*' \
              ! -path '*/build/*' \
              | sort | head -n 300
            echo
            echo '=== BASE44 / PREVIEW REFERENCES ==='
            grep -RniE 'base44|preview is starting|preview|loadUrl|WebView|https?://' project \
              --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' \
              --exclude='*.gif' --exclude='*.ico' --exclude='*.apk' --exclude='*.aab' \
              2>/dev/null | head -n 300 || true
            echo
            echo '=== GRADLE FILES ==='
            find project -type f \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradle.properties' -o -name 'AndroidManifest.xml' \) -print -exec sh -c 'echo "--- $1"; sed -n "1,240p" "$1"' _ {} \;
          } | tee project-inspection.txt

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: JambuL-project-inspection
          path: project-inspection.txt
          if-no-files-found: error

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f './gradlew' ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace -Pkotlin.jvm.target.validation.mode=warning
          else
            gradle assembleDebug --no-daemon --stacktrace -Pkotlin.jvm.target.validation.mode=warning
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JambuL-AI-Tools-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
