name: Build JambuL AI Tools APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            mkdir -p project
            unzip -q "$ZIP" -d project
          fi
          SETTINGS=$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo 'Android Gradle project not found.'
            find . -maxdepth 5 -type f | head -150
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Found: $SETTINGS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure JVM compatibility
        run: |
          cd "$PROJECT_DIR"
          printf '\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n' >> gradle.properties
          if [ -f build.gradle.kts ]; then
            printf '\n// CI JVM compatibility\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }\ntasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach { options.release.set(17) }\n' >> build.gradle.kts
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JambuL-AI-Tools-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
